* { box-sizing:border-box; margin:0; padding:0; }
html, body {

  --basalt-0: #141619;
  --basalt-1: #1B1E22;

  --alab: #EFEADF;
  --alab-2: #E4DCCB;

  --ivory: #F4EFE4;

/* Unified Material Grammar: Basalt (World/Memory) vs Alabaster (Creation/Intention) */
.mat-basalt {
  background-image: linear-gradient(155deg, rgba(22,25,29,0.88), rgba(14,16,19,0.95)), url('../assets/d2_1_basalt_clean.png');
  background-size: 260px 260px;
  border: 1.5px solid rgba(223,188,114,0.52);
  box-shadow: 0 12px 28px rgba(0,0,0,0.58), inset 0 1px 0 rgba(255,250,238,0.12);
}
.mat-alab {
  background-image: linear-gradient(160deg, rgba(247,243,234,0.94), rgba(228,220,203,0.97)), url('../assets/d2_1_alabaster_slab.png');
  background-size: 280px 280px;
  color: var(--ink);
  border: 1.5px solid #9A7F52;
  box-shadow: 0 12px 28px rgba(0,0,0,0.46), inset 0 1px 0 rgba(255,255,255,0.75);
}

/* Architectural Plumb Lines (Subtle visual unity linking the 4 anchors without blocking 3D!) */
.plumb-l {
  position:absolute; left:24px; top:92px; bottom:188px; width:1px;
  background:linear-gradient(180deg, rgba(223,188,114,0.38) 0%, rgba(223,188,114,0.0) 24%, rgba(223,188,114,0.0) 76%, rgba(223,188,114,0.38) 100%);
  pointer-events:none;
}
.plumb-r {
  position:absolute; right:24px; top:126px; bottom:108px; width:1px;
  background:linear-gradient(180deg, rgba(223,188,114,0.38) 0%, rgba(223,188,114,0.0) 24%, rgba(223,188,114,0.0) 76%, rgba(223,188,114,0.38) 100%);
  pointer-events:none;
}
.res-720 .plumb-l { left:16px; top:76px; bottom:154px; }
.res-720 .plumb-r { right:16px; top:104px; bottom:90px; }

/* TOP-LEFT: Unified Stepped Stockpile Monolith (3 recessed stone trays — ZERO crossing lines!) */
.d21-stock {
  position:absolute; top:20px; left:24px;
  display:flex; align-items:stretch; padding:8px 14px 8px 18px; gap:8px;
  clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  border-left: 3px solid var(--aurora);
}
.res-720 .d21-stock { top:14px; left:16px; padding:6px 10px 6px 13px; gap:6px; }
.d21-tray {
  display:flex; align-items:center; gap:8px; padding:6px 12px;
  background: var(--basalt-tray);
  border: 1px solid rgba(223,188,114,0.22);
  border-radius: 3px;
  position:relative;
}
.res-720 .d21-tray { padding:4px 9px; gap:6px; }
.d21-tray.exposed { border-bottom: 2px solid #D99B4E; }
.d21-tray.immune { border-bottom: 2px solid #8D9AA3; }
.d21-tray .v { font-family:var(--fd); font-size:18px; font-weight:700; color:var(--ivory); line-height:1; }
.res-720 .d21-tray .v { font-size:15px; }
.d21-tray .k { font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); display:block; margin-top:2px; }
.res-720 .d21-tray .k { font-size:8.5px; }

/* TOP-RIGHT: Solar Cycle Monolith ("Marco de Ciclo" — ZERO Japanese ema!) */
.d21-cycle {
  position:absolute; top:20px; right:24px; width:262px;
  padding:11px 18px 11px 16px;

.res-720 .d21-cycle { top:14px; right:16px; width:224px; padding:8px 14px 8px 12px; }
.d21-cycle-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
.d21-cycle-title { font-family:var(--fd); font-size:16px; font-weight:700; color:var(--ivory); letter-spacing:0.03em; }
.res-720 .d21-cycle-title { font-size:13.5px; }
.d21-cycle-sub { font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--aurora); }
.res-720 .d21-cycle-sub { font-size:8.5px; }
.d21-speed-row {

}
.d21-sp-group { display:flex; align-items:center; gap:4px; }
.d21-sp {

.res-720 .d21-sp { padding:1px 5px; font-size:10px; }
.d21-sp.on { background:var(--alab); color:var(--ink); border-color:var(--alab); font-weight:700; }
.d21-exp-dot { font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase; color:#E8B05E; font-weight:600; }

/* BOTTOM-LEFT: Joined Founder Diptych Monolith ("Díptico da Casa Fundadora") */
.d21-diptych-wrap {

  display:flex; align-items:flex-end; gap:0;
}
.res-720 .d21-diptych-wrap { bottom:14px; left:16px; }
.d21-diptych {

}
.d21-half {

  transition: transform 140ms ease;
}
.res-720 .d21-half { width:92px; padding:9px 7px 8px; }
.d21-half.left {
  clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%);
  border-right: 2px solid var(--aurora);
}
.d21-half.right {
  clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  border-left: 2px solid var(--aurora);
}
.d21-half.raised {
  transform: translateY(-12px);
  border-color: var(--aurora-hi);
  box-shadow: 0 18px 34px rgba(0,0,0,0.68), 0 0 0 1px rgba(246,223,159,0.55);

.d21-av {

.res-720 .d21-av { width:50px; height:50px; margin-bottom:6px; }

.d21-nameplate {

.res-720 .d21-nameplate { padding:3px 3px; }
.d21-nameplate .nm { font-family:var(--fd); font-size:14.5px; font-weight:700; color:var(--ivory); line-height:1.15; }

.dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
.dot.gold { background:var(--aurora); }
.dot.moss { background:var(--moss-hi); }

/* Crown Emblem straddling the central joining Aurora Seam of the Founder Diptych! */
.d21-crown {
  position:absolute; left:50%; top:-16px; transform:translateX(-50%); z-index:6;
  width:34px; height:34px; border-radius:50%;
  background:#15181B; border:1.5px solid var(--aurora);

.d21-crown img { width:24px; height:24px; object-fit:contain; }
.res-720 .d21-crown img { width:19px; height:19px; }

  padding:2px 8px; background:#14171A; border:1px solid rgba(223,188,114,0.62);
  font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--aurora);
  clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
}
.res-720 .d21-gen-notch { font-size:8.5px; padding:1px 6px; top:-10px; }

/* BOTTOM-RIGHT: Alabaster Construction Keystone + Basalt Utility Wedge */
.d21-cmd {
  position:absolute; bottom:22px; right:24px;
  display:flex; align-items:stretch; gap:8px;
}
.res-720 .d21-cmd { bottom:14px; right:16px; gap:6px; }
.d21-build-key {

.res-720 .d21-build-key .s { font-size:9.5px; }

.d21-util {
  padding:7px 14px; display:flex; flex-direction:column; justify-content:center; gap:5px;

.d21-util-row {
  display:flex; align-items:center; gap:7px; padding:3px 9px;
  background:var(--basalt-tray); border:1px solid rgba(223,188,114,0.22); border-radius:2px;

.res-720 .d21-util-row { font-size:10px; padding:2px 7px; }
.d21-util-row strong { color:var(--aurora); font-weight:700; margin-left:auto; font-size:10px; }
