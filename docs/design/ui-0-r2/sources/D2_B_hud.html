<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><title>D2 — Marcos de Pedra e Eclipse (HUD Normal)</title><style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:#0d0f0e; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
.stage { position:relative; width:100vw; height:100vh; overflow:hidden; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.ic { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.ic svg { width:100%; height:100%; }

:root {
  --fd: "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --fu: "Segoe UI", system-ui, sans-serif;
  --ivory: #F4EFE4;
  --gold: #DFBC72;
  --alab: #EFEADF;
  --ink: #1D1813;
}
body { font-family:var(--fu); color:var(--ivory); }

.k-stone {
  background-image: linear-gradient(155deg, rgba(20,22,24,0.86), rgba(14,16,18,0.92)), url('../assets/d2_kintsugi_basalt.png');
  background-size: cover;
  border: 1.5px solid rgba(223,188,114,0.65);
  box-shadow: 0 10px 28px rgba(0,0,0,0.58);
}
.k-alab {
  background: linear-gradient(160deg, #F5F0E6 0%, #E5DDCD 100%);
  color: var(--ink);
  border: 1.5px solid #8D744C;
  box-shadow: 0 10px 26px rgba(0,0,0,0.44);
}
/* Stepped Asymmetric River-Stone Resource Monoliths (Top-Left) */
.d2-cairn {
  position:absolute; top:20px; left:24px;
  display:flex; align-items:flex-start; gap:10px;
}
.res-720 .d2-cairn { top:14px; left:14px; gap:7px; }
.d2-rock {
  padding:9px 18px; display:flex; align-items:center; gap:9px;
  clip-path: polygon(6px 0, 100% 3px, calc(100% - 5px) 100%, 0 calc(100% - 4px));
}
.res-720 .d2-rock { padding:7px 12px; gap:6px; }
.d2-rock.step2 { margin-top:7px; }
.d2-rock.step3 { margin-top:2px; }
.d2-rock .v { font-family:var(--fd); font-size:18px; font-weight:700; }
.res-720 .d2-rock .v { font-size:14.5px; }

/* Top-Right: Hanging Sanctuary Ema Plaque */
.d2-ema {
  position:absolute; top:16px; right:24px; width:196px; padding:14px 16px;
  clip-path: polygon(0 4px, 50% 0, 100% 4px, 97% 100%, 3% 96%);
  text-align:center;
}
.res-720 .d2-ema { width:162px; padding:10px 12px; right:14px; }

/* Bottom-Left: Twin Tilted Basalt Founder Steles */
.d2-steles {
  position:absolute; bottom:22px; left:24px;
  display:flex; align-items:flex-end; gap:14px;
}
.res-720 .d2-steles { bottom:14px; left:14px; gap:10px; }
.d2-stele {
  width:108px; padding:12px 10px 14px; text-align:center;
  clip-path: polygon(6px 6px, 100% 0, calc(100% - 4px) 100%, 0 98%);
  position:relative;
}
.res-720 .d2-stele { width:88px; padding:8px 6px 10px; }
.d2-stele.raised { transform:translateY(-22px); border-color:#F5D996; }
.d2-stele-av { width:62px; height:62px; border-radius:50%; overflow:hidden; margin:0 auto 8px; border:2px solid var(--gold); }
.res-720 .d2-stele-av { width:48px; height:48px; margin-bottom:5px; }
.d2-stele-av img { width:100%; height:100%; object-fit:cover; }

/* Bottom-Right: Alabaster Construction Maquette Slab + Basalt Command Slab */
.d2-slabs {
  position:absolute; bottom:22px; right:24px;
  display:flex; align-items:flex-end; gap:12px;
}
.res-720 .d2-slabs { bottom:14px; right:14px; gap:8px; }
.d2-slab-btn {
  padding:12px 18px; display:flex; align-items:center; gap:12px;
  clip-path: polygon(8px 0, 100% 4px, calc(100% - 6px) 100%, 0 calc(100% - 3px));
}
.res-720 .d2-slab-btn { padding:8px 12px; gap:8px; }
