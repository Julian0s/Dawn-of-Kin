<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><title>D3 — Tear de Trama e Semente (HUD Normal)</title><style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:#0d0f0e; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; }
.stage { position:relative; width:100vw; height:100vh; overflow:hidden; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.ic { display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.ic svg { width:100%; height:100%; }

:root {
  --fd: "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --fu: "Segoe UI", system-ui, sans-serif;
  --linen: #EFE6D4;
  --ink: #241D15;
  --moss: #2E3D30;
  --clay: #AE5736;
  --thread: #D7C6A5;
}
body { font-family:var(--fu); color:var(--ink); }

.linen-cloth {
  background-image: linear-gradient(180deg, rgba(242,233,215,0.92), rgba(232,221,199,0.95)), url('../assets/d3_linen_weave.png');
  background-size: 260px 260px;
  border: 2px solid #7E6D55;
  box-shadow: inset 0 0 0 4px rgba(242,233,215,0.5), inset 0 0 0 5px rgba(126,109,85,0.35), 0 10px 26px rgba(24,18,10,0.36);
}
.ceramic-glaze {
  background-image: linear-gradient(160deg, rgba(44,58,46,0.9), rgba(28,39,30,0.95)), url('../assets/d3_ceramic_moss.png');
  background-size: 260px 260px;
  color: #F6EFE0;
  border: 2px solid #D7C6A5;
  box-shadow: 0 8px 22px rgba(18,22,16,0.46);
}

/* Top-Left: Harvest Linen Thread + 3 Glazed Ceramic Seed Medallions (NO BOX!) */
.d3-thread-row {
  position:absolute; top:22px; left:24px;
  display:flex; align-items:center; gap:16px;
}
.res-720 .d3-thread-row { top:14px; left:14px; gap:10px; }
.d3-cord {
  position:absolute; top:23px; left:10px; right:10px; height:2px;
  background: repeating-linear-gradient(90deg, #E7DAC0 0 8px, #A59070 8px 12px);
  z-index:0;
}
.d3-seed {
  position:relative; z-index:1;
  padding:8px 18px; border-radius:26px 8px 26px 8px;
  display:flex; align-items:center; gap:8px;
  color:#FAF3E4; border:2px solid #DFD0B2;
  box-shadow:0 6px 16px rgba(18,16,12,0.44);
}
.res-720 .d3-seed { padding:6px 13px; gap:6px; }
.d3-seed.wood { background:linear-gradient(145deg,#6E4C31,#462E1B); }
.d3-seed.stone { background:linear-gradient(145deg,#525D62,#323A3E); }
.d3-seed.food { background:linear-gradient(145deg,#BC643D,#873F22); }
.d3-seed .n { font-family:var(--fd); font-size:17px; font-weight:700; }
.res-720 .d3-seed .n { font-size:14px; }

/* Top-Right: Four-Petal Botanical Season Rosette + Stitched Linen Capsule */
.d3-season {
  position:absolute; top:18px; right:24px;
  display:flex; align-items:center; gap:10px;
}
.res-720 .d3-season { top:12px; right:14px; gap:8px; }
.d3-rosette {
  width:62px; height:62px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
}
.res-720 .d3-rosette { width:50px; height:50px; }

/* Bottom-Left: Overlapping Ceramic Family Nest (Pod silhouette + Sprout bud!) */
.d3-nest {
  position:absolute; bottom:20px; left:24px;
  display:flex; align-items:center;
}
.res-720 .d3-nest { bottom:14px; left:14px; transform:scale(0.84); transform-origin:bottom left; }
.d3-nest-pod {
  width:72px; height:72px; border-radius:50%; overflow:hidden;
  border:3px solid #E5D7BC;
  box-shadow:0 8px 20px rgba(18,22,16,0.52);
  position:relative; z-index:2;
}
.d3-nest-pod img { width:100%; height:100%; object-fit:cover; }
.d3-nest-sprout {
  position:absolute; left:54px; bottom:-8px; z-index:4;
  width:28px; height:28px; border-radius:50%;
  background:#5D8247; border:2px solid #F2E8D5;
  color:#FFF; font-weight:700; font-size:14px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.45);
}

/* Bottom-Right: Stitched Ceramic Action Petals */
.d3-petals {
  position:absolute; bottom:20px; right:24px;
  display:flex; align-items:flex-end; gap:10px;
}
.res-720 .d3-petals { bottom:14px; right:14px; gap:7px; }
.d3-petal-btn {
  padding:10px 18px; border-radius:24px 8px 24px 8px;
  display:flex; align-items:center; gap:8px;
  font-family:var(--fd); font-size:14.5px; font-weight:700;
}
.res-720 .d3-petal-btn { padding:7px 12px; font-size:12.5px; }
</style></head><body><div class="stage"><img class="bg" id="bg" src="../../ui-0/captures/base_m1_clean_1920x1080.jpg"/>
