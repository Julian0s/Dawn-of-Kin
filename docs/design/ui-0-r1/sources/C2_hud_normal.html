<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><title>Conceito C — HUD Normal</title><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0f110e; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
.bg-scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ic { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ic svg { width: 100%; height: 100%; }

:root {
  --font-title: "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --font-ui: "Segoe UI", system-ui, sans-serif;
  --ivory: #F4EFE1;
  --gold: #DFC285;
  --gold-dim: rgba(212,181,116,0.48);
  --slate: #1C2124;
  --slate-deep: #131719;
  --sage: #8BB077;
}
body { font-family: var(--font-ui); color: var(--ivory); }

.slate-panel {
  background-image: linear-gradient(180deg, rgba(26,31,34,0.88), rgba(18,22,24,0.94)), url('../assets/tex_c_slate_filigree.png');
  background-size: 100% 100%;
  border: 1.5px solid rgba(212,181,116,0.62);
  box-shadow: inset 0 0 0 1px rgba(244,239,225,0.08), 0 10px 30px rgba(0,0,0,0.52);
  border-radius: 10px;
}

/* Concept C Unique Layout: TOP-LEFT 100% OPEN! Only a floating solar seal at top-right */
.c-solar-seal {
  position: absolute; top: 18px; right: 22px;
  display: flex; align-items: center; gap: 12px;
  padding: 7px 14px 7px 9px;
  background: rgba(22,27,30,0.86);
  border: 1px solid rgba(212,181,116,0.58);
  border-radius: 99px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.45);
}
.res-720 .c-solar-seal { top: 12px; right: 14px; gap: 8px; padding: 5px 11px 5px 7px; }
.c-emblem-mini { width: 32px; height: 32px; }
.res-720 .c-emblem-mini { width: 26px; height: 26px; }
.c-speed-dots { display: flex; gap: 4px; }
.c-speed-dots span {
  padding: 2px 7px; border-radius: 99px; font-size: 11px; color: #9DA4A6;
  border: 1px solid transparent;
}
.c-speed-dots span.on {
  border-color: var(--gold); color: var(--ivory); background: rgba(212,181,116,0.18);
}

/* Bottom-Center Unified Lineage Altar Arc (Signature Silhouette!) */
.c-altar-wrap {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: flex-end; justify-content: center;
}
.res-720 .c-altar-wrap { bottom: 10px; }
.c-altar {
  position: relative;
  display: flex; align-items: center; gap: 22px;
  padding: 10px 32px;
  background: linear-gradient(180deg, rgba(28,34,37,0.93) 0%, rgba(18,22,25,0.96) 100%);
  border: 1.5px solid rgba(212,181,116,0.68);
  border-radius: 44px 44px 16px 16px;
  box-shadow: inset 0 1px 0 rgba(244,239,225,0.18), 0 12px 34px rgba(0,0,0,0.58);
}
.res-720 .c-altar { gap: 14px; padding: 8px 22px; }
.c-res-cluster { display: flex; align-items: center; gap: 14px; }
.c-res-orb {
  display: flex; align-items: center; gap: 6px;
}
.c-res-orb .val { font-family: var(--font-title); font-size: 16px; font-weight: 600; color: var(--ivory); }
.res-720 .c-res-orb .val { font-size: 13.5px; }

.c-lineage-core {
  display: flex; align-items: center; gap: 0;
  padding: 0 10px;
  position: relative;
}
.c-founder-ring {
  width: 58px; height: 58px; border-radius: 50%; overflow: hidden;
  border: 2.5px solid var(--gold);
  box-shadow: 0 0 0 3px rgba(19,23,25,0.9), 0 4px 14px rgba(0,0,0,0.55);
  background: #14181A; z-index: 2;
}
.res-720 .c-founder-ring { width: 46px; height: 46px; }
.c-founder-ring img { width: 100%; height: 100%; object-fit: cover; }
.c-gold-thread {
  width: 44px; height: 44px; margin: 0 -6px; z-index: 3;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: radial-gradient(circle, #252B2E 0%, #14181A 100%);
  border: 1.5px solid var(--gold);
}
.res-720 .c-gold-thread { width: 34px; height: 34px; }
.c-gold-thread img { width: 28px; height: 28px; }
.res-720 .c-gold-thread img { width: 22px; height: 22px; }

.c-medallion-actions { display: flex; align-items: center; gap: 10px; }
.c-medallion-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 12px; border-radius: 24px;
  background: rgba(15,19,21,0.75);
  border: 1px solid rgba(212,181,116,0.48);
  color: var(--ivory); font-size: 11px; font-family: var(--font-title); letter-spacing: 0.04em;
}
.res-720 .c-medallion-btn { padding: 5px 9px; font-size: 10px; }
.c-medallion-btn.active {
  background: rgba(212,181,116,0.22); border-color: var(--gold); color: #FFF8E6;
}
</style></head><body><div class="stage"><img class="bg-scene" id="bg" src="../../ui-0/captures/base_m1_clean_1920x1080.jpg" />
<!-- TOP-LEFT 100% OPEN FOR WORLD & FOG! Only a compact solar seal at top-right -->
<div class="c-solar-seal">
  <img class="c-emblem-mini" src="../assets/emblem_dawn_of_kin.png"/>
  <div>
    <div style="font-family:var(--font-title);font-size:13px;font-weight:600;letter-spacing:0.05em;">Clareira Inicial</div>
    <div style="font-size:10.5px;color:var(--gold);">Primavera · Ano 1 · Exposto</div>
  </div>
  <div style="width:1px;height:22px;background:var(--gold-dim);margin:0 4px;"></div>
  <div class="c-speed-dots"><span>||</span><span class="on">1×</span><span>2×</span><span>4×</span></div>
  <span class="ic" style="width:24px;height:24px;margin-left:2px;"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="#D3B474" stroke-width="1.2" opacity="0.65"/><path d="M8 9.5H16M8 12H16M8 14.5H16" stroke="#F0E4C8" stroke-width="1.5" stroke-linecap="round"/></svg></span>

<!-- BOTTOM-CENTER SIGNATURE LINEAGE ALTAR ARC -->
<div class="c-altar-wrap">

    <div class="c-res-cluster">
      <div class="c-res-orb"><span class="ic" style="width:24px;height:24px;"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#C8A96B" stroke-width="1.1" stroke-opacity="0.5"/><path d="M12 6.5V17.5M12 11L8.5 8.5M12 13L15.5 10.5" stroke="#E0B679" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="val">24</span></div>
      <div class="c-res-orb"><span class="ic" style="width:24px;height:24px;"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#C8A96B" stroke-width="1.1" stroke-opacity="0.5"/><polygon points="12,6.5 17,12 12,17.5 7,12" stroke="#C5CFD6" stroke-width="1.5" fill="#C5CFD6" fill-opacity="0.16"/></svg></span><span class="val">14</span></div>
      <div class="c-res-orb"><span class="ic" style="width:24px;height:24px;"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#C8A96B" stroke-width="1.1" stroke-opacity="0.5"/><path d="M8.5 14.5C9.2 10 12 7.5 16 7.5C15.5 11.8 12.8 14.5 8.5 14.5Z" stroke="#E5B063" stroke-width="1.5" fill="#E5B063" fill-opacity="0.22"/></svg></span><span class="val">18</span></div>
    </div>

    <div style="width:1px;height:36px;background:linear-gradient(180deg,transparent,var(--gold),transparent);"></div>

    <div class="c-lineage-core">
      <div class="c-founder-ring" title="Alden"><img src="../assets/portrait_alden.jpg"/></div>
      <div class="c-gold-thread"><img src="../assets/emblem_dawn_of_kin.png"/></div>
      <div class="c-founder-ring" title="Brena"><img src="../assets/portrait_brena.jpg"/></div>
    </div>

    <div style="width:1px;height:36px;background:linear-gradient(180deg,transparent,var(--gold),transparent);"></div>

    <div class="c-medallion-actions">
      <div class="c-medallion-btn active"><span class="ic" style="width:20px;height:20px;"><svg viewBox="0 0 24 24" fill="none"><path d="M5.5 12L12 6.2L18.5 12M7.8 10.8V17.8H16.2V10.8" stroke="#E8D2A0" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="14" r="1.4" fill="#E8D2A0"/></svg></span><span>Construir</span></div>
      <div class="c-medallion-btn"><span class="ic" style="width:20px;height:20px;"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="6.5" stroke="#E8D2A0" stroke-width="1.4" stroke-dasharray="3 2"/><path d="M12 8.2V12L14.8 13.8" stroke="#E8D2A0" stroke-width="1.5" stroke-linecap="round"/></svg></span><span>Tarefas</span></div>
      <div class="c-medallion-btn"><span class="ic" style="width:20px;height:20px;"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="7.5" r="2.2" stroke="#E8D2A0" stroke-width="1.5"/><circle cx="7.5" cy="16" r="2" stroke="#C7BA99" stroke-width="1.4"/><circle cx="16.5" cy="16" r="2" stroke="#C7BA99" stroke-width="1.4"/><path d="M12 9.7V12.5M12 12.5L7.5 14M12 12.5L16.5 14" stroke="#D3B474" stroke-width="1.3"/></svg></span><span>Linhagem</span></div>
    </div>
  </div>
</div>
</div>
<script>
(function(){
  const p = new URLSearchParams(window.location.search);
  const res = p.get('res') || '1920x1080';
  if (res === '1280x720') document.body.classList.add('res-720');
  const bg = document.getElementById('bg');
  if (bg && 'base_m1_clean') bg.src = '../../ui-0/captures/base_m1_clean_' + res + '.jpg';
