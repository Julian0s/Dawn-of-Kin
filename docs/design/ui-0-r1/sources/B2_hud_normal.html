<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"/><title>Conceito B — HUD Normal</title><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0f110e; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
.bg-scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ic { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ic svg { width: 100%; height: 100%; }

:root {
  --font-title: "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --font-ui: "Segoe UI", system-ui, sans-serif;
  --ink: #241B14;
  --ink-mid: #534234;
  --ink-light: #7F6D5B;
  --paper: #F4ECDD;
  --wax-red: #8F3226;
  --wax-olive: #4B663A;
  --brass: #9F7C44;
}
body { font-family: var(--font-ui); color: var(--ink); }

.paper-sheet {
  position: relative;
  background-image: linear-gradient(180deg, rgba(247,240,226,0.92), rgba(238,228,208,0.95)), url('../assets/tex_b_paper_map.png');
  background-size: 100% 100%;
  border: 1.5px solid #8A7152;
  box-shadow: inset 0 0 0 3px rgba(247,240,226,0.75), inset 0 0 0 4px rgba(122,95,64,0.45), 0 8px 26px rgba(24,18,12,0.34);
  border-radius: 2px;
}

/* Concept B Unique Layout: Top-Left Brass Compass + Folded Cartography Strip */
.b-compass-banner {
  position: absolute; top: 18px; left: 22px;
  display: flex; align-items: center;
}
.res-720 .b-compass-banner { top: 12px; left: 14px; }
.b-compass-orb {
  width: 78px; height: 78px; z-index: 2;
  filter: drop-shadow(0 5px 12px rgba(20,14,8,0.48));
}
.res-720 .b-compass-orb { width: 62px; height: 62px; }
.b-map-ribbon {
  margin-left: -24px; padding: 9px 26px 9px 36px;
  background: linear-gradient(90deg, rgba(245,237,222,0.96), rgba(238,228,208,0.92));
  border: 1.5px solid #8A7152;
  box-shadow: inset 0 0 0 2px rgba(255,250,240,0.6), 0 6px 18px rgba(24,18,12,0.32);
  clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 50%, 100% 100%, 0 100%);
}
.res-720 .b-map-ribbon { padding: 6px 22px 6px 32px; }
.b-region { font-family: var(--font-title); font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: 0.05em; text-transform: uppercase; }
.res-720 .b-region { font-size: 13px; }
.b-subrow { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-mid); margin-top: 2px; }
.b-speed-ink { display: inline-flex; gap: 3px; }
.b-speed-ink span { padding: 1px 6px; border: 1px solid rgba(110,86,58,0.4); font-size: 11px; font-weight: 700; color: var(--ink-mid); }
.b-speed-ink span.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Top-Right: Tied Linen Field Tags (light paper tags + wax seal!) */
.b-ledger {
  position: absolute; top: 18px; right: 20px;
  display: flex; align-items: center; gap: 10px;
}
.res-720 .b-ledger { top: 12px; right: 14px; gap: 7px; }
.b-tag {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 14px;
  background: rgba(246,238,223,0.94);
  border: 1.5px solid #8D7455;
  box-shadow: 0 5px 14px rgba(22,16,10,0.28);
  border-radius: 2px;
}
.res-720 .b-tag { padding: 5px 10px; gap: 5px; }
.b-tag .num { font-family: var(--font-title); font-size: 17px; font-weight: 700; color: var(--ink); }
.res-720 .b-tag .num { font-size: 14px; }
.b-wax {
  padding: 6px 14px; border-radius: 99px;
  background: radial-gradient(circle at 35% 30%, #B44535, #76251B);
  border: 2px solid #D9B07C;
  color: #FDF3E2; font-family: var(--font-title); font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  box-shadow: 0 4px 10px rgba(30,10,6,0.42);
}
.b-wax.olive { background: radial-gradient(circle at 35% 30%, #61804B, #3C522E); }

/* Bottom-Left: Inked Journal Medallions */
.b-journal-founders {
  position: absolute; bottom: 20px; left: 22px;
  display: flex; align-items: center; gap: 14px;
}
.b-portrait-ring {
  display: flex; align-items: center; gap: 9px;
  padding: 5px 14px 5px 5px;
  background: rgba(245,237,222,0.93);
  border: 1.5px solid #8A7152;
  border-radius: 99px;
  box-shadow: 0 6px 16px rgba(22,16,10,0.32);
}
.b-circle-av {
  width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
  border: 2px solid #59432B; flex-shrink: 0;
}
.res-720 .b-circle-av { width: 36px; height: 36px; }
.b-circle-av img { width: 100%; height: 100%; object-fit: cover; }

/* Bottom-Right: Field Notebook Action Tabs */
.b-folio-tabs {
  position: absolute; bottom: 20px; right: 20px;
  display: flex; gap: 8px;
}
.b-tab-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  background: rgba(245,237,222,0.95);
  border: 1.5px solid #7E6548;
  border-bottom: 4px solid #7E6548;
  color: var(--ink);
  font-family: var(--font-title); font-size: 14px; font-weight: 700; letter-spacing: 0.03em;
  box-shadow: 0 6px 16px rgba(22,16,10,0.34);
}
.res-720 .b-tab-btn { padding: 7px 12px; font-size: 12.5px; }
.b-tab-btn.wax-active {
  background: #2C2118; color: #F5ECDC; border-color: #C7A36A; border-bottom-color: #C7A36A;
}
</style></head><body><div class="stage"><img class="bg-scene" id="bg" src="../../ui-0/captures/base_m1_clean_1920x1080.jpg" />
